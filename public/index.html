<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Mero Mausam — Weather</title>
    <meta
      name="description"
      content="Current conditions, a 7-day forecast and an hourly outlook for any city — with a minute-by-minute rain nowcast."
    />

    <!--
      Declares support for both schemes so the browser paints form controls and
      the initial canvas in the right one instead of flashing white.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

    <!--
      DESIGN.md specifies Airbnb Cereal VF, which is licensed to Airbnb only; the
      spec's own guidance names Inter as the substitute. Preconnect before the
      stylesheet so the font connection is warm by the time CSS asks for it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.open-meteo.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <noscript>
      Mero Mausam needs JavaScript to fetch and display the forecast. Please
      enable it to continue.
    </noscript>
    <div id="root"></div>
  </body>
</html>
